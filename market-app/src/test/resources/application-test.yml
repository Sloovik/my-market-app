spring:
  r2dbc:
    url: r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;MODE=LEGACY
    username: sa
    password:

  data:
    redis:
      host: localhost
      port: 6379

  sql:
    init:
      mode: always

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            token-uri: http://localhost:9999/test-token

payment:
  service:
    url: http://localhost:8081

logging:
  level:
    com.example.mymarketapp: DEBUG