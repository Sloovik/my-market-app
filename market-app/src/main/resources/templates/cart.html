<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Корзина</title>
    <style>
        .error { color: red; font-weight: bold; margin: 10px 0; }
        .warning { color: orange; font-weight: bold; margin: 10px 0; }
        .success { color: green; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
    </style>
</head>
<body>
<h1>Корзина</h1>

<div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>
<div th:if="${paymentMessage}" class="warning" th:text="${paymentMessage}"></div>

<table border="1">
    <tr>
        <th>Товар</th>
        <th>Цена</th>
        <th>Кол-во</th>
        <th>Действия</th>
    </tr>
    <tr th:each="item : ${items}">
        <td>
            <img th:src="${item.imgPath}" style="width:100px;"/>
            <span th:text="${item.title}"></span>
        </td>
        <td th:text="${#numbers.formatInteger(item.price, 3, 'COMMA')} + ' ₽'">0 ₽</td>
        <td th:text="${item.count}">0</td>
        <td>
            <form th:action="@{/cart/items}" method="post" style="display:inline;">
                <input type="hidden" th:name="id" th:value="${item.id}"/>
                <button name="action" value="PLUS">+</button>
                <button name="action" value="MINUS">-</button>
                <button name="action" value="DELETE">Удалить</button>
            </form>
        </td>
    </tr>
</table>

<h2>Итого: <span th:text="${#numbers.formatInteger(total, 0, 'COMMA')}">0</span> ₽</h2>

<div th:if="${balance != null && balance > 0}">
    <p>Баланс: <span class="success" th:text="${#numbers.formatInteger(balance, 0, 'COMMA')} + ' ₽'">0 ₽</span></p>
</div>

<form th:action="@{/orders/buy}" method="post">
    <button type="submit" th:disabled="${!canCheckout}">Оформить заказ</button>
</form>

<p><a th:href="@{/items}">← Товары</a> | <a th:href="@{/orders}">Заказы</a></p>
</body>
</html>
