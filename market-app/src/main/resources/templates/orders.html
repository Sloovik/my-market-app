<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Мои заказы</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 10px; text-align: left; border: 1px solid #ddd; }
        th { background-color: #f5f5f5; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        a.btn { display: inline-block; padding: 8px 16px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; }
        a.btn:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="header">
    <h1>Мои заказы</h1>

    <div sec:authorize="isAuthenticated()">
        <span>Привет, <strong sec:authentication="name"></strong></span>
        <form method="post" th:action="@{/logout}" style="display: inline; margin-left: 10px;">
            <button type="submit">Выход</button>
        </form>
    </div>
</div>

<table th:if="${!#lists.isEmpty(orders)}">
    <thead>
    <tr>
        <th>Номер заказа</th>
        <th>Товаров</th>
        <th>Сумма</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="'#' + ${order.id}">0</td>
        <td th:text="${order.items.size()} + ' шт.'">0 товаров</td>
        <td th:text="${#numbers.formatInteger(order.totalSum, 3, 'COMMA')} + ' ₽'">0 ₽</td>
        <td>
            <a th:href="@{/orders/{id}(id=${order.id})}" class="btn">Подробнее</a>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${#lists.isEmpty(orders)}" class="empty-state">
    <p>У вас пока нет заказов</p>
    <a th:href="@{/items}" class="btn">Перейти к покупкам</a>
</div>

<p style="margin-top: 30px;">
    <a th:href="@{/items}">← Товары</a> |
    <a th:href="@{/cart}">Корзина</a>
</p>

</body>
</html>
